# yamllint disable rule:line-length
---
name: parquet4seastar CI

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  http_proxy: http://10.0.1.5:10089
  https_proxy: http://10.0.1.5:10089
  BUILD_TYPE: Release
  # ccache configuration
  CCACHE_DIR: ~/.ccache
  CCACHE_MAXSIZE: 10G
  CCACHE_COMPRESS: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.repository_owner == 'clapdb' }}
    runs-on: [self-hosted, linux, build]
    timeout-minutes: 30

    steps:
      - name: Clean stale build directories
        run: sudo rm -rf build seastar || true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: work around permission issue
        run: git config --global --add safe.directory ${{ github.workspace }}

      - name: Get Seastar
        run: |
          if [ ! -d "seastar" ]; then
            git clone --depth 1 https://github.com/scylladb/seastar.git
          fi

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DSEASTAR_PATH=${{ github.workspace }}/seastar \
            -DENABLE_PARQUET4SEASTAR_TEST=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(nproc)

      - name: Test
        working-directory: ${{ github.workspace }}
        run: |
          # Run all tests
          timeout --preserve-status -s SIGKILL -k 10s 5m build/tests/rle_encoding_test -- -c2 || true
          timeout --preserve-status -s SIGKILL -k 10s 5m build/tests/compression_test -- -c2 || true
          timeout --preserve-status -s SIGKILL -k 10s 5m build/tests/thrift_serdes_test_test -- -c2 || true
          timeout --preserve-status -s SIGKILL -k 10s 5m build/tests/dictionary_encoder_test -- -c2 || true
          timeout --preserve-status -s SIGKILL -k 10s 5m build/tests/column_chunk_writer_test -- -c2 || true
          timeout --preserve-status -s SIGKILL -k 10s 5m build/tests/file_writer_test -- -c2 || true
          timeout --preserve-status -s SIGKILL -k 10s 5m build/tests/delta_binary_packed_test -- -c2 || true
          timeout --preserve-status -s SIGKILL -k 10s 5m build/tests/delta_length_byte_array_test -- -c2 || true
          timeout --preserve-status -s SIGKILL -k 10s 5m build/tests/delta_byte_array_test -- -c2 || true
          timeout --preserve-status -s SIGKILL -k 10s 5m build/tests/byte_stream_split_test -- -c2 || true
          timeout --preserve-status -s SIGKILL -k 10s 5m build/tests/plain_encoding_test -- -c2 || true
          timeout --preserve-status -s SIGKILL -k 10s 5m build/tests/bpacking_test -- -c2 || true
          timeout --preserve-status -s SIGKILL -k 10s 5m build/tests/column_chunk_reader_test -- -c2 || true
          timeout --preserve-status -s SIGKILL -k 10s 5m build/tests/record_reader_test -- -c2 || true
          # Tests that need working directory
          cd tests/test_data/alltypes && timeout --preserve-status -s SIGKILL -k 10s 5m ../../../build/tests/cql_reader_alltypes_test -- -c2 || true
          cd ${{ github.workspace }}
          cd tests/test_data/parquet-testing && timeout --preserve-status -s SIGKILL -k 10s 5m ../../../build/tests/cql_reader_test -- -c2 || true
